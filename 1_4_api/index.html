<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Tables</title>
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/table.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <section class="section_primary">
      <h2>Table without API</h2>
      <div id="rawTable"></div>
    </section>

    <hr class="section_divider" />

    <section class="section_primary">
      <h2>Table without Body</h2>
      <div id="emptyTable"></div>
    </section>

    <hr class="section_divider" />

    <section class="section_primary">
      <h2>Table without Head</h2>
      <div id="headlessTable"></div>
    </section>

    <hr class="section_divider" />

    <section class="section_primary">
      <h2>Table with API, but without inputs</h2>
      <div id="usersTable"></div>
    </section>

    <hr class="section_divider" />

    <section class="section_primary">
      <h2>Table with API and Inputs</h2>
      <div id="productsTable"></div>
    </section>

    <script src="assets/js/main.js" type="module"></script>
  </body>
</html>
